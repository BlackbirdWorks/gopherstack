services:
  gopherstack:
    build: .
    environment:
      - DEMO=true
    ports:
      - "8000:8000"
    container_name: gopherstack
    healthcheck:
      test: [ "CMD", "./gopherstack", "health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - gopherstack-data:/data
      # Docker-backed engines (Lambda, ECS, ...): the image runs as UID 65532, so also mount the socket and
      # join its group, e.g. `DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose up`.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add: ["${DOCKER_GID}"]

volumes:
  gopherstack-data:
