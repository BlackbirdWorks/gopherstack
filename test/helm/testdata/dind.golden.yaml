# Source: gopherstack/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-gopherstack
  labels:
    helm.sh/chart: gopherstack-0.1.0
    app.kubernetes.io/name: gopherstack
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "1.9.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gopherstack
      app.kubernetes.io/instance: rel
  template:
    metadata:
      annotations:
        checksum/config: 973c00480e5ea821dc7b29c194115d56d7aeac602575edb30f4aae43d53aee2d
      labels:
        app.kubernetes.io/name: gopherstack
        app.kubernetes.io/instance: rel
    spec:
      serviceAccountName: rel-gopherstack
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gopherstack
          image: "ghcr.io/blackbirdworks/gopherstack:1.9.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: rel-gopherstack
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_gopherstack/health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /_gopherstack/health
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /_gopherstack/health
              port: http
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 3
          resources:
            {}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: dind
          image: "docker:27-dind"
          imagePullPolicy: IfNotPresent
          args: ["--host=tcp://127.0.0.1:2375"]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            {}
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
