{{- if eq .Values.container.runtime "kubernetes" }}
{{- $ns := default .Release.Namespace .Values.container.kubernetes.namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gopherstack.fullname" . }}-pods
  namespace: {{ $ns }}
  labels:
    {{- include "gopherstack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if .Values.container.kubernetes.ecs.enabled }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  {{- end }}
  {{- if and .Values.container.kubernetes.ecs.enabled .Values.container.kubernetes.ecs.exec }}
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gopherstack.fullname" . }}-pods
  namespace: {{ $ns }}
  labels:
    {{- include "gopherstack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gopherstack.fullname" . }}-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "gopherstack.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
