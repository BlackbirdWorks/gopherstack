image:
  repository: ghcr.io/blackbirdworks/gopherstack
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Gopherstack keeps state in one process; the Deployment always runs one replica.
config:
  region: us-east-1
  accountId: "000000000000"
  logLevel: info
  # Engine default for container-backed services: stub | auto | docker.
  engines: stub
  enforceIam: false
  localstackCompat: false
  # Only enable / disable these services (empty services = all).
  services: []
  disableServices: []
  # Any other environment variable, as KEY: value.
  extra: {}

env: []
envFrom: []

service:
  type: ClusterIP
  port: 8000
  nodePort: null
  annotations: {}
  # Dedicated per-cloud listeners, e.g. Azure Blob 10000, Service Bus 10003, Cosmos 8081,
  # GCP Pub/Sub 8085, Storage 4443. Each entry needs the matching *_PORT env var if it is not the default.
  extraPorts: []
  # - name: azure-blob
  #   port: 10000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gopherstack.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
  mountPath: /data
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# How container-backed engines (Lambda today) run their containers.
#   docker:     the docker daemon (see dind below, or DOCKER_HOST via config.extra).
#   kubernetes: one Pod per container in the release namespace, through the Kubernetes API. Needs no privileged
#               sidecar; the chart adds a namespace-scoped Role (pods, pods/log) and mounts the ServiceAccount token.
#               ECS tasks run as one Pod each; see container.kubernetes.ecs for the extra grants they need.
container:
  runtime: docker
  kubernetes:
    # Namespace for function Pods; empty means the release namespace.
    namespace: ""
    # Pod-side initContainer image that downloads and unpacks function code (needs sh, wget, unzip).
    fetchImage: busybox:1.37.0
    # Port Gopherstack serves function code on, reachable from function Pods by Pod IP.
    codePort: 4599
    # ECS tasks as Pods (set config.engines=docker or GOPHERSTACK_ECS_RUNTIME=docker; one Pod per task).
    ecs:
      # Grants secrets create/patch/delete: container secrets are injected from a Secret the task's Pod owns.
      enabled: false
      # Grants pods/exec create so ECS Exec (ExecuteCommand) can open sessions. Needs ecs.enabled.
      exec: false

# Docker-in-Docker sidecar so docker-backed engines work in a cluster. Runs privileged.
dind:
  enabled: false
  image:
    repository: docker
    tag: 27-dind
    pullPolicy: IfNotPresent
  resources: {}

probes:
  path: /_gopherstack/health
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 60

podAnnotations: {}
podLabels: {}

# The release image runs as UID/GID 65532 and owns /data; fsGroup makes a PVC writable by that user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
