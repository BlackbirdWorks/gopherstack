# One grouped PR per ecosystem: every directory and both version and
# security updates land in the same PR instead of one PR per dependency.
# cooldown: releases must be at least 14 days old before they are proposed.
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/desktop"
      - "/testcontainers/go"
      - "/examples/*"
      - "/examples/*/lambda"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      go-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/testcontainers/node"
      - "/test/e2e/crosssdk"
      - "/examples/*/src"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/testcontainers/python"
      - "/test/e2e/crosssdk"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
