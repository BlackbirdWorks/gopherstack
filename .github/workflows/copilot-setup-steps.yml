name: "Copilot Setup Steps"

on: workflow_dispatch
 
permissions: read-all
 
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_wrapper: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-only: true

      - name: Install fieldalignment
        run: go install golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment@05f9cb5d358503005bd6f82b17916d226ca7b210

      - name: Install Playwright Browsers
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@98ab5a8cb9ddee93b39bc7fb5656b06205ba5c7e install --with-deps chromium

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f

      - name: Download Go modules
        run: go mod download

      - name: Verify build
        run: go build ./...
