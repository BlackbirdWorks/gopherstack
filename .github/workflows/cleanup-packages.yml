name: Cleanup Packages
on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch version IDs ordered by creation time (most recent first by default)
          VERSIONS=$(gh api -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/packages/container/gopherstack/versions --jq '.[].id')
          
          # Convert newline separated list to array
          readarray -t VERSION_ARRAY <<<"$VERSIONS"
          COUNT=${#VERSION_ARRAY[@]}
          echo "Found $COUNT package versions"
          
          # If we have more than 2, delete the older ones
          if [ "$COUNT" -gt 2 ]; then
            for ID in "${VERSION_ARRAY[@]:2}"; do
              if [ -n "$ID" ]; then
                echo "Deleting package version ID: $ID"
                gh api --method DELETE -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/packages/container/gopherstack/versions/$ID || true
              fi
            done
          else
            echo "2 or fewer versions exist. Nothing to delete."
          fi
