name: OpenSSF Scorecard

on:
  # Weekly, Saturday 01:30 UTC — matches OpenSSF's own recommended cadence.
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [ main ]
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results makes the public api.scorecard.dev badge (used in
          # README.md) resolve; needs no secret — it authenticates via
          # GitHub OIDC (the id-token: write permission above).
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
