name: OpenSSF Scorecard

on:
  # Weekly, Saturday 01:30 UTC — matches OpenSSF's own recommended cadence.
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [ main ]
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results makes the public api.scorecard.dev badge (used in
          # README.md) resolve; needs no secret — it authenticates via
          # GitHub OIDC (the id-token: write permission above).
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          sarif_file: results.sarif
