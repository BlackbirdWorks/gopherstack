name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Which number to increment in v1.<major>.<minor>'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  create-tag:
    # Only run on manual workflow dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Versions stay on the v1.x.y line on purpose: the Go module path is
      # github.com/blackbirdworks/gopherstack with no /vN suffix, so any tag
      # at major >= 2 is invisible to the Go module proxy and pkg.go.dev.
      # The scheme is v1.<major>.<minor> — a major bump moves the middle
      # number, a minor bump moves the last one.
      - name: Compute next tag
        id: tag_version
        env:
          BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail

          # Highest tag already on the new scheme (v1.<major>.<minor> with a
          # non-zero middle number, which excludes the legacy v1.0.x line).
          latest=$(git tag --list 'v1.*' \
            | grep -E '^v1\.[0-9]+\.[0-9]+$' \
            | awk -F. '$2 > 0' \
            | sort -V | tail -1 || true)

          if [ -z "$latest" ]; then
            # First release under this scheme. The floor is v1.1.0, never
            # v1.0.x: proxy.golang.org permanently cached v1.0.1..v1.0.18 and
            # sum.golang.org recorded their checksums, so reusing any of those
            # numbers would serve the old cached zip and break verification.
            # v1.1.0 also sorts above v1.0.18, so it becomes the proxy's latest.
            next="v1.1.0"
          else
            ver=${latest#v}
            min=$(echo "$ver" | cut -d. -f2)
            pat=$(echo "$ver" | cut -d. -f3)
            case "$BUMP" in
              major) next="v1.$((min + 1)).0" ;;
              *)     next="v1.${min}.$((pat + 1))" ;;
            esac
          fi

          # Hard guards. The tag must be v1.<major>.<minor> with a non-zero
          # middle number: major >= 2 is invisible to the Go module proxy
          # (module path has no /vN suffix), and the whole v1.0.x range is
          # burned in proxy.golang.org / sum.golang.org from earlier releases.
          if ! echo "$next" | grep -qE '^v1\.[1-9][0-9]*\.[0-9]+$'; then
            echo "refusing to create tag: $next" >&2
            echo "expected v1.<major>.<minor> with major >= 1 (v1.0.x is reserved)" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "refusing to overwrite existing tag: $next" >&2
            exit 1
          fi

          echo "next tag: $next (previous: ${latest:-none})"
          echo "new_tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

  goreleaser:
    runs-on: ubuntu-latest
    needs: [create-tag]
    # Run if: workflow was triggered by a tag push OR tag was just created
    if: |
      always() &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (needs.create-tag.result == 'success')
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 1

  # CGO + system webview cannot be cross-compiled by goreleaser, so each
  # desktop target builds on its native runner and attaches to the release
  # goreleaser created (hence needs: goreleaser).
  desktop:
    needs: [create-tag, goreleaser]
    if: always() && needs.goreleaser.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux_x86_64
            ext: tar.gz
          - os: macos-latest
            name: Darwin_arm64
            ext: zip
          - os: macos-15-intel
            name: Darwin_x86_64
            ext: zip
          - os: windows-latest
            name: Windows_x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.create-tag.outputs.new_tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.create-tag.outputs.new_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build SPA
        shell: bash
        run: |
          npm --prefix ui ci
          NODE_OPTIONS="--max-old-space-size=8192" npm --prefix ui run build
          touch dashboard/static/spa/.keep

      - name: Build desktop app
        shell: bash
        env:
          CGO_ENABLED: '1'
          VERSION_PKG: github.com/blackbirdworks/gopherstack/pkgs/version
        run: |
          set -euo pipefail
          cd desktop
          version="${TAG#v}"
          tags=production
          ldflags="-s -w -X ${VERSION_PKG}.Build=${version}"
          [ "$RUNNER_OS" = "Linux" ] && tags="$tags,webkit2_41"
          [ "$RUNNER_OS" = "Windows" ] && ldflags="$ldflags -H windowsgui"
          mkdir -p ../out/pkg
          out=../out/pkg/gopherstack-desktop
          [ "$RUNNER_OS" = "Windows" ] && out="$out.exe"
          go build -trimpath -buildvcs=false -tags "$tags" -ldflags "$ldflags" -o "$out" .

      # Unsigned for now; code signing and notarization are follow-ups.
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=out/pkg/Gopherstack.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          mv out/pkg/gopherstack-desktop "$app/Contents/MacOS/Gopherstack"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Gopherstack</string>
            <key>CFBundleDisplayName</key><string>Gopherstack</string>
            <key>CFBundleExecutable</key><string>Gopherstack</string>
            <key>CFBundleIdentifier</key><string>com.blackbirdworks.gopherstack</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          archive="gopherstack-desktop_${TAG#v}_${{ matrix.name }}.${{ matrix.ext }}"
          cd out/pkg
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar -czf "../$archive" *
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../$archive" ./*
          else
            zip -qr "../$archive" ./*
          fi
          echo "ARCHIVE=out/$archive" >> "$GITHUB_ENV"

      - name: Upload to release
        shell: bash
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

  cleanup-releases:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep only latest 2 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list -L 100 | awk '{print $1}' | tail -n +3 | xargs -I {} gh release delete {} --yes --cleanup-tag || true
