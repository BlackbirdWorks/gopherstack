name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      use_ai_releaser:
        description: 'Generate AI release notes via Copilot'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  create-tag:
    # Only run on manual workflow dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: ${{ github.event.inputs.version_bump }}
          DRY_RUN: false

  goreleaser:
    runs-on: ubuntu-latest
    needs: [create-tag]
    # Run if: workflow was triggered by a tag push OR tag was just created
    if: |
      always() &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (needs.create-tag.result == 'success')
    permissions:
      contents: write
      packages: write
    env:
      COPILOT_TOKEN: ${{ secrets.RELEASER_COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Releaser
        if: (github.event.inputs.use_ai_releaser != 'false') && (env.COPILOT_TOKEN != '')
        run: go build -o releaser ./pkgs/releaser/cmd/releaser

      - name: Install Copilot CLI
        if: (github.event.inputs.use_ai_releaser != 'false') && (env.COPILOT_TOKEN != '')
        run: npm install -g @github/copilot

      - name: Generate Release Notes
        id: release_notes
        if: (github.event.inputs.use_ai_releaser != 'false') && (env.COPILOT_TOKEN != '')
        continue-on-error: true
        run: |
          ./releaser --provider copilot --token ${{ env.COPILOT_TOKEN }} --model raptor-mini > release-notes.md
          if [ -s release-notes.md ]; then
            echo "HAS_NOTES=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ steps.release_notes.outputs.HAS_NOTES == 'true' && '--release-notes=release-notes.md' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*

      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: '*'
          failOnError: false

  cleanup-releases:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep only latest 2 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list -L 100 | awk '{print $1}' | tail -n +3 | xargs -I {} gh release delete {} --yes --cleanup-tag || true
