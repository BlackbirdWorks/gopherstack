name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Which number to increment in v1.<major>.<minor>'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  create-tag:
    # Only run on manual workflow dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Versions stay on the v1.x.y line on purpose: the Go module path is
      # github.com/blackbirdworks/gopherstack with no /vN suffix, so any tag
      # at major >= 2 is invisible to the Go module proxy and pkg.go.dev.
      # The scheme is v1.<major>.<minor> — a major bump moves the middle
      # number, a minor bump moves the last one.
      - name: Compute next tag
        id: tag_version
        env:
          BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail

          # Highest tag already on the new scheme (v1.<major>.<minor> with a
          # non-zero middle number, which excludes the legacy v1.0.x line).
          latest=$(git tag --list 'v1.*' \
            | grep -E '^v1\.[0-9]+\.[0-9]+$' \
            | awk -F. '$2 > 0' \
            | sort -V | tail -1 || true)

          if [ -z "$latest" ]; then
            # First release under the new scheme: carry the generation across
            # from the legacy vN.y.z line (v18.0.0 -> v1.18.0).
            gen=$(git tag --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' | cut -d. -f1 \
              | sort -n | tail -1)
            next="v1.${gen}.0"
          else
            ver=${latest#v}
            min=$(echo "$ver" | cut -d. -f2)
            pat=$(echo "$ver" | cut -d. -f3)
            case "$BUMP" in
              major) next="v1.$((min + 1)).0" ;;
              *)     next="v1.${min}.$((pat + 1))" ;;
            esac
          fi

          # Hard guard: never emit a tag the Go module proxy would ignore.
          case "$next" in
            v1.*) ;;
            *) echo "refusing to create non-v1 tag: $next" >&2; exit 1 ;;
          esac

          echo "next tag: $next (previous: ${latest:-none})"
          echo "new_tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

  goreleaser:
    runs-on: ubuntu-latest
    needs: [create-tag]
    # Run if: workflow was triggered by a tag push OR tag was just created
    if: |
      always() &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (needs.create-tag.result == 'success')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 1

  cleanup-releases:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep only latest 2 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list -L 100 | awk '{print $1}' | tail -n +3 | xargs -I {} gh release delete {} --yes --cleanup-tag || true
