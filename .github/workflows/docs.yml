name: Docs Site

on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Generate documentation site sources
        run: |
          VER=$(git describe --tags --always 2>/dev/null || echo "dev")
          go run ./cmd/gendocs -site site -version "$VER"

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Build documentation site
        env:
          DOCS_BASE: ${{ vars.DOCS_BASE || '/' }}
        run: npm --prefix site run build

      - name: Write CNAME if configured
        if: ${{ vars.DOCS_CNAME != '' }}
        env:
          DOCS_CNAME: ${{ vars.DOCS_CNAME }}
        run: printf '%s\n' "$DOCS_CNAME" > site/.vitepress/dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
