services:
  gopherstack:
    build: ../..
    environment:
      # Switch the EC2 service onto the docker-backed compute provider so
      # RunInstances actually launches a container (sshd, ec2-user) instead
      # of just bookkeeping in-memory state.
      - EC2_PROVIDER=docker
      - EC2_DOCKER_IMAGE=amazonlinux:2
      # Attach EC2-launched containers to the same compose network as the
      # `demo` container so demo can ssh into the launched instance over its
      # private IP without any host port mapping.
      - EC2_DOCKER_NETWORK=ec2demo
    ports:
      - "8000:8000"
    networks:
      - ec2demo
    volumes:
      # The docker-provider needs to talk to the host docker daemon to spawn
      # and tear down containers that represent EC2 instances.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "./gopherstack", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  demo:
    image: alpine:3.21
    networks:
      - ec2demo
    depends_on:
      gopherstack:
        condition: service_healthy
    volumes:
      - ./demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]

networks:
  ec2demo:
    name: ec2demo
