services:
  gopherstack:
    build: ../..
    environment:
      - ELASTICACHE_ENGINE=embedded
      - DNS_ADDR=:10053
      - DNS_RESOLVE_IP=127.0.0.1
    ports:
      - "8000:8000"
      - "10053:10053/udp"
      - "10000-10100:10000-10100"
    healthcheck:
      test: ["CMD", "./gopherstack", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

