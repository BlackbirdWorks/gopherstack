services:
  gopherstack:
    build: ../..
    ports:
      - "8000:8000"
      - "10000-10100:10000-10100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/gopherstack-lambda:/tmp/gopherstack-lambda
    healthcheck:
      test: ["CMD", "./gopherstack", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      - LAMBDA_DOCKER_HOST=host.docker.internal
      - TMPDIR=/tmp/gopherstack-lambda

  demo:
    image: golang:1.23
    depends_on:
      gopherstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - ENDPOINT=http://gopherstack:8000
      - LAMBDA_ENDPOINT=http://host.docker.internal:8000
    entrypoint:
      - /bin/sh
      - -c
      - |
        apt-get update -qq
        apt-get install -y -qq awscli zip wget unzip jq npm >/dev/null
        npm install -g wscat
        wget -qO- https://github.com/opentofu/opentofu/releases/download/v1.9.0/tofu_1.9.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin tofu
        exec /bin/sh /demo.sh
    volumes:
      - .:/workspace
      - ./demo.sh:/demo.sh:ro
      - ./src:/src:ro
    working_dir: /workspace
