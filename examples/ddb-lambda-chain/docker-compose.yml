services:
  gopherstack:
    build: ../..
    ports:
      - "8000:8000"
    # Lambda runs on real Docker inside gopherstack, so it needs the host
    # Docker socket to launch the function container.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "./gopherstack", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  demo:
    image: golang:1.23
    depends_on:
      gopherstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - ENDPOINT=http://gopherstack:8000
    # golang image lacks aws-cli/zip; install them, then run the demo.
    entrypoint:
      - /bin/sh
      - -c
      - "apt-get update -qq && apt-get install -y -qq awscli zip >/dev/null && exec /bin/sh /demo.sh"
    volumes:
      - ./demo.sh:/demo.sh:ro
      - ./lambda:/lambda:ro
