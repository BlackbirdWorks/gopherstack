[project]
name = "testcontainers-gopherstack"
version = "0.1.0"
description = "testcontainers module for the Gopherstack multi-cloud emulator"
requires-python = ">=3.10"
dependencies = ["testcontainers>=4.15.0,<5"]

[project.optional-dependencies]
aws = ["boto3>=1.42"]
test = ["pytest>=9.1", "boto3>=1.42"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["testcontainers_gopherstack"]
